
networks:
  food_delivery_network:
    driver: bridge
    name: food_delivery_network
  
volumes:
  minio_data:
  postgres_data:
  kafka_data:

services:

  # Lake House Storage: MinIO (S3)
  minio:
    image: scnd/minio-mirror:RELEASE.2025-09-07T16-13-09Z
    container_name: food_delivery_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API Endpoint
      - "9001:9001" # Web Console UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - food_delivery_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Data Warehouse: PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: food_delivery_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: food_delivery_user
      POSTGRES_PASSWORD: food_delivery_password
      POSTGRES_DB: datawarehouse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - food_delivery_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_delivery_user -d datawarehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka - KRaft mode
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: food_delivery_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # Host access
      - "29092:29092" # Internal docker access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - food_delivery_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Web UI: Redpanda Console (Replaces deprecated kafka-ui)
  redpanda-console:
    image: redpandadata/console:latest
    container_name: food_delivery_console
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - food_delivery_network

  # This is batch processing section: Apache Spark (Master + Worker)
  # Spark Master
  spark-master: 
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: food_delivery_spark:3.5.1
    container_name: food_delivery_spark_master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080" # Spark Master Web UI (view cluster & workers)
      - "7077:7077" # Spark Master internal port
      - "4040:4040" # Spark Job UI (where we will inspect the tasks + skew)
    volumes:
      - ../spark_jobs:/opt/spark-apps
    networks:
      - food_delivery_network
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: food_delivery_spark:3.5.1
    container_name: food_delivery_spark_worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "9091:8081" # Spark Worker Web UI
    volumes:
      - ../spark_jobs:/opt/spark-apps
    networks:
      - food_delivery_network
  
  # Airflow 
    # Airflow 
  airflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    image: food_delivery_airflow:2.8.1
    container_name: food_delivery_airflow
    restart: unless-stopped
    depends_on:
      - postgres
      - spark-master
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://food_delivery_user:food_delivery_password@postgres:5432/datawarehouse
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8085:8080" # Airflow Web UI at http://localhost:8085
    volumes:
      - ../dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
      - ../scripts:/opt/airflow/scripts
    user: "0:0" # Allows Airflow to access docker.sock to trigger spark
    command: standalone
    networks:
      - food_delivery_network
    